<VirtualHost *:80>
    ServerName cobranca.local
    DocumentRoot "/var/www/html/cobranca/public"

    <Directory "/var/www/html/cobranca">
        AllowOverride All
        Require all granted
    </Directory>
 
    ErrorLog ${APACHE_LOG_DIR}/cobranca-error.log
    CustomLog ${APACHE_LOG_DIR}/cobranca-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName pix.local
    DocumentRoot "/var/www/html/pix-link"

    <Directory "/var/www/html/pix-link">
        AllowOverride All
        Require all granted
    </Directory>
 
    ErrorLog ${APACHE_LOG_DIR}/pix-link-error.log
    CustomLog ${APACHE_LOG_DIR}/pix-link-access.log combined
</VirtualHost>

